name: CI — tests y typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: astro check + smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (astro check)
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Smoke test del editor (runtime)
        run: node test-editor.mjs

      - name: Tests del prototipo (regresión)
        run: node test-prototype.cjs
